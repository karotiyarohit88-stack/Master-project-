name: PostgreSQL Dependency Bootstrap

on:
  push:
    branches:
      - feature/master-project-api-key-secret-manager

permissions:
  contents: write

concurrency:
  group: postgres-dependency-bootstrap
  cancel-in-progress: false

jobs:
  add-postgres-driver:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm

      - name: Add pinned PostgreSQL driver and generate lockfile
        run: npm install --save-exact pg@8.16.3

      - name: Verify dependency install and existing project checks
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Commit generated manifests on this feature branch only
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "PostgreSQL dependency is already integrated."
          else
            git commit -m "chore: add PostgreSQL database driver"
            git push origin "HEAD:${BRANCH_NAME}"
          fi
