name: PostgreSQL Dependency Bootstrap

on:
  push:
    branches:
      - feature/master-project-api-key-secret-manager

permissions:
  contents: write

concurrency:
  group: postgres-dependency-bootstrap
  cancel-in-progress: false

jobs:
  add-postgres-driver:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm

      - name: Add pinned PostgreSQL driver and generate lockfile
        id: pg_install
        run: |
          set +e
          npm pkg set 'devDependencies.esbuild=^0.28.0'
          npm install --save-exact pg@8.16.3 --save-dev @types/pg --no-audit --no-fund > postgres-dependency-install.log 2>&1
          result=$?
          tail -n 120 postgres-dependency-install.log
          exit $result

      - name: Upload dependency install diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-dependency-install-log
          path: postgres-dependency-install.log
          if-no-files-found: warn
          retention-days: 3

      - name: Verify dependency install and existing project checks
        id: verify
        run: |
          set +e
          {
            npm ci
            install_status=$?
            if [ $install_status -eq 0 ]; then npm run lint; lint_status=$?; else lint_status=99; fi
            if [ $install_status -eq 0 ] && [ $lint_status -eq 0 ]; then npm run build; build_status=$?; else build_status=99; fi
            echo "npm_ci_exit=$install_status"
            echo "lint_exit=$lint_status"
            echo "build_exit=$build_status"
            test $install_status -eq 0 && test $lint_status -eq 0 && test $build_status -eq 0
          } > postgres-validation.log 2>&1
          result=$?
          tail -n 180 postgres-validation.log
          exit $result

      - name: Upload dependency validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-dependency-validation-log
          path: postgres-validation.log
          if-no-files-found: warn
          retention-days: 3

      - name: Commit generated manifests on this feature branch only
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "PostgreSQL dependency is already integrated."
          else
            git commit -m "chore: add PostgreSQL database driver"
            git push origin "HEAD:${BRANCH_NAME}"
          fi
