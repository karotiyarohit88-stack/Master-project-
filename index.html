<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>Master Project AI Agent</title>
    <meta name="theme-color" content="#059669" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
    <link rel="apple-touch-icon" href="/assets/aistudio/1791973196299_d0ac9fe0.png" />
    <meta name="description" content="Central AI assistant for software design, programming, database planning, testing, security reviews, deployment, and future worker agent planning." />
    <meta property="og:title" content="Master Project AI Agent" />
    <meta property="og:description" content="Central AI assistant for software design, programming, database planning, testing, security reviews, deployment, and future worker agent planning." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      html,body{margin:0;min-height:100%;background:#f8fafc;color:#0f172a;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      #root{min-height:100vh;min-height:100dvh}
      #app-startup{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
      .startup-mark{width:54px;height:54px;border-radius:17px;background:#059669;color:white;display:grid;place-items:center;font-weight:800;letter-spacing:.04em;box-shadow:0 8px 24px #05966933}
      .startup-title{font-size:18px;font-weight:700}.startup-subtitle{font-size:13px;color:#64748b}
      .startup-track{width:min(180px,60vw);height:3px;background:#d1fae5;border-radius:9px;overflow:hidden}.startup-track span{display:block;width:42%;height:100%;background:#059669;border-radius:9px;animation:startup-progress 1.1s ease-in-out infinite alternate}
      @keyframes startup-progress{from{transform:translateX(-5%)}to{transform:translateX(145%)}}
      @media(prefers-reduced-motion:reduce){.startup-track span{animation:none;width:100%}}
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-startup" role="status" aria-live="polite">
        <div class="startup-mark">MP</div>
        <div class="startup-title">Master Project AI Agent</div>
        <div class="startup-subtitle">Loading your workspace…</div>
        <div class="startup-track"><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
