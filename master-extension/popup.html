
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Project AI Agent</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app">
    <header>
      <h2>Master Project</h2>
      <p>AI Agent Command Center</p>
    </header>

    <section class="status">
      <span class="dot"></span>
      <span>Extension Interface Ready</span>
    </section>

    <label for="command">अपना कमांड लिखें</label>
    <textarea id="command" placeholder="बताइए, क्या काम करना है?"></textarea>

    <button id="send">कमांड तैयार करें</button>

    <section class="suggestions">
      <button class="suggestion">Agent बनाने की योजना</button>
      <button class="suggestion">Project Status</button>
      <button class="suggestion">Security Check</button>
    </section>

    <p id="result" role="status">
      आपका कमांड यहाँ दिखाई देगा।
    </p>

    <footer>Human approval required for sensitive actions.</footer>
  </main>

  <script src="popup.js"></script>
</body>
</html>
